name: Build My Summaries APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Copy web files to www
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Use fixed signing key and raise minSdk
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          grep -n "POST_NOTIFICATIONS" "$M"
          echo "=== SHA-1 / SHA-256 to add in Firebase ==="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Apply app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          RES = 'android/app/src/main/res'
          src = Image.open('icon.jpg').convert('RGBA')
          def sized(n, pad):
              bg = Image.new('RGBA', (n, n), (255, 255, 255, 255))
              s = int(n * (1 - 2 * pad))
              bg.alpha_composite(src.resize((s, s), Image.LANCZOS), ((n - s) // 2, (n - s) // 2))
              return bg
          def mask(im, kind):
              n = im.size[0]
              m = Image.new('L', (n * 4, n * 4), 0)
              d = ImageDraw.Draw(m)
              if kind == 'round':
                  d.ellipse((0, 0, n * 4 - 1, n * 4 - 1), fill=255)
              else:
                  d.rounded_rectangle((0, 0, n * 4 - 1, n * 4 - 1), radius=int(n * 4 * 0.22), fill=255)
              o = im.copy()
              o.putalpha(m.resize((n, n), Image.LANCZOS))
              return o
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          fore = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for k in legacy:
              d = f'{RES}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              for f in os.listdir(d):
                  if f.startswith('ic_launcher'):
                      os.remove(os.path.join(d, f))
              n = legacy[k]
              big = sized(n * 4, 0.04)
              mask(big, 'rounded').resize((n, n), Image.LANCZOS).save(f'{d}/ic_launcher.png')
              mask(big, 'round').resize((n, n), Image.LANCZOS).save(f'{d}/ic_launcher_round.png')
              n = fore[k]
              c = Image.new('RGBA', (n, n), (0, 0, 0, 0))
              s = int(n * 0.60)
              c.alpha_composite(src.resize((s, s), Image.LANCZOS), ((n - s) // 2, (n - s) // 2))
              c.save(f'{d}/ic_launcher_foreground.png')
          import glob
          for f in glob.glob(RES + '/drawable*/splash*.png'):
              try:
                  w, h = Image.open(f).size
              except Exception:
                  continue
              c = Image.new('RGBA', (w, h), (255, 255, 255, 255))
              s = int(min(w, h) * 0.45)
              c.alpha_composite(src.resize((s, s), Image.LANCZOS), ((w - s) // 2, (h - s) // 2))
              c.convert('RGB').save(f)
              print('splash replaced:', f, w, h)
          PY
          RES=android/app/src/main/res
          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          XML
          for f in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$f.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      - name: Add google-services.json and sync
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          npx cap sync android

      - name: Add Google Sign-In library (fixes crash on launch)
        run: |
          grep -q "play-services-auth" android/app/build.gradle || printf "\ndependencies {\n    implementation 'com.google.android.gms:play-services-auth:20.7.0'\n}\n" >> android/app/build.gradle
          echo "=== end of android/app/build.gradle ==="
          tail -n 6 android/app/build.gradle

      - name: Force the fixed signing key in Gradle
        run: |
          if ! grep -q "androiddebugkey" android/app/build.gradle; then
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("$PWD/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          fi
          echo "=== end of android/app/build.gradle ==="
          tail -n 14 android/app/build.gradle

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify the APK (Google Sign-In library and signing key)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct, sys, zipfile
          APK = 'android/app/build/outputs/apk/debug/app-debug.apk'
          WANT = 'Lcom/google/android/gms/auth/api/signin/GoogleSignIn;'
          errors = []

          def uleb(d, o):
              r = s = 0
              while True:
                  b = d[o]; o += 1
                  r |= (b & 0x7f) << s
                  if not b & 0x80:
                      return r, o
                  s += 7

          def has_class(z):
              for n in z.namelist():
                  if not (n.startswith('classes') and n.endswith('.dex')):
                      continue
                  d = z.read(n)
                  s_off = struct.unpack_from('<I', d, 0x3C)[0]
                  t_off = struct.unpack_from('<I', d, 0x44)[0]
                  c_size, c_off = struct.unpack_from('<II', d, 0x60)
                  for i in range(c_size):
                      ci = struct.unpack_from('<I', d, c_off + 32 * i)[0]
                      si = struct.unpack_from('<I', d, t_off + 4 * ci)[0]
                      so = struct.unpack_from('<I', d, s_off + 4 * si)[0]
                      _, p = uleb(d, so)
                      if d[p:d.index(b'\x00', p)].decode('utf-8', 'replace') == WANT:
                          return True
              return False

          def signer_sha1(path):
              d = open(path, 'rb').read()
              cd = struct.unpack_from('<I', d, d.rfind(b'PK\x05\x06') + 16)[0]
              if d[cd - 16:cd] != b'APK Sig Block 42':
                  return None
              pos = cd - struct.unpack_from('<Q', d, cd - 24)[0]
              end = cd - 24
              while pos < end:
                  ln = struct.unpack_from('<Q', d, pos)[0]
                  pid = struct.unpack_from('<I', d, pos + 8)[0]
                  if pid in (0x7109871a, 0xf05368c0):
                      v = d[pos + 12:pos + 8 + ln]
                      o = 12
                      o += 4 + struct.unpack_from('<I', v, o)[0]
                      o += 4
                      n = struct.unpack_from('<I', v, o)[0]
                      return hashlib.sha1(v[o + 4:o + 4 + n]).hexdigest()
                  pos += 8 + ln
              return None

          ok = has_class(zipfile.ZipFile(APK))
          print('GoogleSignIn inside APK:', ok)
          if not ok:
              errors.append('GoogleSignIn is missing from the APK, the app will crash on launch. Check the step Add Google Sign-In library.')

          sha = signer_sha1(APK)
          pretty = ':'.join(sha[i:i + 2] for i in range(0, 40, 2)).upper() if sha else None
          gs = 'android/app/google-services.json'
          if os.path.exists(gs):
              reg = set()
              for c in json.load(open(gs)).get('client', []):
                  for oc in c.get('oauth_client', []):
                      h = (oc.get('android_info') or {}).get('certificate_hash')
                      if h:
                          reg.add(h.lower())
              print('APK signing SHA-1:', pretty)
              print('SHA-1 registered in google-services.json:', sorted(reg))
              if sha is None or sha not in reg:
                  errors.append('APK is signed with SHA-1 ' + str(pretty) + ' which is not registered in google-services.json, so Google sign-in will fail (error 10). Add this SHA-1 in Firebase and replace google-services.json.')
          else:
              print('google-services.json not found, skipping the SHA-1 check')

          for e in errors:
              print('::error::' + e)
          sys.exit(1 if errors else 0)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Summaries-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator (prints crash reason)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.mysummaries.app -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            adb shell pidof com.mysummaries.app || echo "APP IS NOT RUNNING - IT CRASHED OR EXITED"
            echo "=========== CRASH / ERRORS ==========="
            grep -n -A 30 "FATAL EXCEPTION" logcat.txt | head -120 || true
            grep -n "chromium.*CONSOLE\|Capacitor.*rror\|Uncaught" logcat.txt | head -40 || true

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore
